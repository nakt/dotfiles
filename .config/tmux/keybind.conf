unbind C-b
set -g prefix C-j

unbind r
bind r source-file ~/.tmux.conf\; display-message "tmux.conf reloaded!"

bind = select-layout even-horizontal
bind + select-layout even-vertical
bind E select-layout tiled

# claude-sessions: a opens it in a narrow pane on the right, A runs it in the current pane.
# resize-pane runs after the after-split-window hook, which would otherwise even out the width.
bind a split-window -h -l 42 -c "#{pane_current_path}" "~/.local/bin/claude-sessions --repo" \; resize-pane -x 42
bind A send-keys "~/.local/bin/claude-sessions" Enter

unbind-key -T copy-mode-vi Space ; bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi C-v   ; bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi [     ; bind-key -T copy-mode-vi [ send-keys -X begin-selection
unbind-key -T copy-mode-vi ]     ; bind-key -T copy-mode-vi ] send-keys -X copy-selection
